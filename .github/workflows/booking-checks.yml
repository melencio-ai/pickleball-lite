name: Booking checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan view:cache
      - run: php artisan test
      - run: node --check public/booking-survey.js

      - run: node --check public/open-play-admin.js
      - run: node --check public/calendar.js
      - run: node --check public/landing-navigation.js
      - run: node --check public/auth.js
      - run: node --check public/workspace.js
      - run: node --check public/messenger.js
      - run: node --check public/help.js
      - run: php artisan help:check
  mysql-concurrency:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: pickle_lite_test
          MYSQL_USER: pickle_test
          MYSQL_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pickle_lite_test
      DB_USERNAME: pickle_test
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test --filter=MySqlBookingConcurrencyTest

  calendar-browser:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/pickle-lite-calendar.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      APP_URL: http://127.0.0.1:8000
      # Browser-only registration fixture: no email is submitted in this suite.
      PICKLE_SELF_REGISTRATION_ENABLED: 'true'
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.example.test
      MAIL_FROM_ADDRESS: support@example.test
      PICKLE_WALKTHROUGH_VIDEO_URL: 'https://youtu.be/AbCdEf12345'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch /tmp/pickle-lite-calendar.sqlite
      - run: php artisan migrate --force --seed
      - run: php artisan tinker --execute="App\Models\Venue::firstOrFail()->users()->create(['name'=>'Browser Test','email'=>'browser-calendar@example.test','password'=>'browser-test-password-123','role'=>'owner']);"
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/pickle-calendar-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/up && break; sleep 1; done
          node tests/browser/calendar-smoke.mjs
          node tests/browser/venue-website-smoke.mjs
          node tests/browser/venue-theme-smoke.mjs
      - run: |
          export PICKLE_PRODUCT_HOST=pickle-web.test PICKLE_APP_HOST=pickle-app.test PICKLE_BOOK_HOST=pickle-book.test PICKLE_LEGACY_HOST=pickle-legacy.test
          SERVICE_ROLE=marketing APP_URL=http://pickle-web.test SESSION_DRIVER=database php artisan platform:check-schema
          SERVICE_ROLE=marketing APP_URL=http://pickle-web.test SESSION_DRIVER=database php artisan serve --host=127.0.0.1 --port=8001 > /tmp/pickle-web.log 2>&1 &
          SERVICE_ROLE=management APP_URL=http://pickle-app.test SESSION_DRIVER=database SESSION_COOKIE=pickle_app_test_session php artisan serve --host=127.0.0.1 --port=8002 > /tmp/pickle-app.log 2>&1 &
          SERVICE_ROLE=booking APP_URL=http://pickle-book.test SESSION_DRIVER=database php artisan serve --host=127.0.0.1 --port=8003 > /tmp/pickle-book.log 2>&1 &
          for port in 8001 8002 8003; do
            for i in $(seq 1 20); do curl -fsS http://127.0.0.1:$port/up && break; sleep 1; done
          done
          node tests/browser/dedicated-services-smoke.mjs
          php artisan tinker --execute="App\\Models\\User::where('email','browser-calendar@example.test')->firstOrFail()->forceFill(['platform_admin'=>true])->save();"
          node tests/browser/legal-policies-smoke.mjs
      - run: |
          SERVICE_ROLE=help PICKLE_HELP_HOST=pickle-help.test PICKLE_HELP_PREVIEW_HOST=pickle-help-preview.test APP_URL=http://pickle-help.test DB_CONNECTION=sqlite DB_DATABASE=/tmp/does-not-exist-help.sqlite SESSION_DRIVER=array CACHE_STORE=array php artisan serve --host=127.0.0.1 --port=8004 > /tmp/pickle-help.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8004/up && break; sleep 1; done
          node tests/browser/help-center-smoke.mjs
      - if: failure()
        run: cat /tmp/pickle-calendar-server.log /tmp/pickle-web.log /tmp/pickle-app.log /tmp/pickle-book.log /tmp/pickle-help.log || true
